<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <title>prayer times</title>
</head>
<body class="loading">
    <div class="container">
        <div class="head">
            <div class="date-details">
                <p id="day" class="skeleton"></p>
                <p id="date" class="skeleton"></p>
                <p id="today-date" class="skeleton"></p>
            </div>    
        </div>
        <div class="card next">
            <h2 id="next-name" class="skeleton"></h2>
            <p id="next" class="skeleton"></p>
        </div>
        <center><p class="sunnah skeleton"></p></center>
        <div class="content">
            <div class="card">
                <h2>الفجر</h2>
                <P id="fagr" class="skeleton"></P>
            </div>
            <div class="card">
                <h2>الظهر</h2>
                <P id="duhr" class="skeleton"></P>
            </div>
            <div class="card">
                <h2>العصر</h2>
                <P id="asr" class="skeleton"></P>
            </div>
            <div class="card">
                <h2>المغرب</h2>
                <P id="maghrib" class="skeleton"></P>
            </div>
            <div class="card">
                <h2>العشاء</h2>
                <P id="isha" class="skeleton"></P>
            </div>
        </div>
    </div>
    
    <script src="code.js"></script>
</body>
</html>
